name: Remove old Maven package

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  remove:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove the previously published Spear Dashing package
        shell: python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import json
          import os
          import urllib.error
          import urllib.request

          url = 'https://api.github.com/users/mmaarij123/packages/maven/io.github.mmaarij123.spear-dashing'
          headers = {
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'Spear-Dashing-Package-Cleanup',
          }
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
              package = json.load(response)
          assert package['name'] == 'io.github.mmaarij123.spear-dashing'
          assert package['package_type'] == 'maven'
          assert package['repository']['full_name'] == 'mmaarij123/Spear-Dashing'
          assert package['version_count'] == 1, 'Unexpected additional package versions; review before deleting.'
          with urllib.request.urlopen(urllib.request.Request(url, method='DELETE', headers=headers), timeout=30) as response:
              assert response.status == 204
          try:
              urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30)
          except urllib.error.HTTPError as error:
              assert error.code == 404, f'Unexpected verification response: {error.code}'
          else:
              raise AssertionError('Package is still accessible after deletion')
          print('Old Maven package removed; authenticated lookup now returns 404.')
